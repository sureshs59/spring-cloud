spring.application.name=actuatorDemo
server.port=9191

management.endpoint.health.show-details=always
management.health.resilience4j.enabled=true
management.endpoints.web.exposure.include=*

#Database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/test
spring.datasource.username=root
spring.datasource.password=Mysql@2026

#JPA and Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===================================================================
# \u2705 FIXED: Circuit Breaker configuration (Removed the extra 'e')
# ===================================================================

# 1. Define global default settings
resilience4j.circuitbreaker.configs.default.register-health-indicator=true
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.sliding-window-type=COUNT_BASED

# 2. Assign the default settings to your specific service instance
resilience4j.circuitbreaker.instances.orderService.base-config=default
